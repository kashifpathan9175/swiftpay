server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: transaction-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: true
    locations: classpath:db/migration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/swift-pay_txn_gateway}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  # Kafka configuration for transaction-gateway service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

      acks: all
      enable-idempotence: true
      retries: 10
      properties:
        max.in.flight.requests.per.connection: 5



  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

swiftpay:
  app:
    name: ${spring.application.name}
    version: 0.1.0-SNAPSHOT
    environment: ${SPRING_PROFILES_ACTIVE:local}

  kafka:
    partitions: ${KAFKA_PARTITIONS:6}
    replicas: ${KAFKA_REPLICAS:1}

    outbox:
      poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:1000}
