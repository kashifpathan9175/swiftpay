apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  namespace: swiftpay
  labels:
    app: ledger-service
    app.kubernetes.io/name: swiftpay
    app.kubernetes.io/part-of: payment-ledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger-service
  template:
    metadata:
      labels:
        app: ledger-service
        app.kubernetes.io/name: swiftpay
        app.kubernetes.io/part-of: payment-ledger
    spec:
      containers:
        - name: ledger-service
          image: swiftpay-ledger-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: swiftpay-app-config
                  key: SPRING_PROFILES_ACTIVE
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: swiftpay-app-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: swiftpay-app-config
                  key: DB_PORT
            - name: LEDGER_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: swiftpay-app-config
                  key: LEDGER_DB_NAME
            - name: DB_URL
              value: jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(LEDGER_DB_NAME)
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: swiftpay-db-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftpay-db-secret
                  key: DB_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: swiftpay-app-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_CONSUMER_GROUP
              value: ledger-service
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
