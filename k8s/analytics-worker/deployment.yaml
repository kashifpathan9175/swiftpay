apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-worker
  namespace: swiftpay
  labels:
    app: analytics-worker
    app.kubernetes.io/name: swiftpay
    app.kubernetes.io/part-of: payment-ledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-worker
  template:
    metadata:
      labels:
        app: analytics-worker
        app.kubernetes.io/name: swiftpay
        app.kubernetes.io/part-of: payment-ledger
    spec:
      containers:
        - name: analytics-worker
          image: swiftpay-analytics-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: swiftpay-app-config
                  key: SPRING_PROFILES_ACTIVE
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: swiftpay-app-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: swiftpay-app-config
                  key: DB_PORT
            - name: ANALYTICS_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: swiftpay-app-config
                  key: ANALYTICS_DB_NAME
            - name: ANALYTICS_DB_URL
              value: jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(ANALYTICS_DB_NAME)
            - name: ANALYTICS_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: swiftpay-db-secret
                  key: ANALYTICS_DB_USERNAME
            - name: ANALYTICS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftpay-db-secret
                  key: ANALYTICS_DB_PASSWORD
            - name: ANALYTICS_DB_DRIVER_CLASS_NAME
              value: "org.postgresql.Driver"
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA
              value: "analytics"
            - name: SPRING_FLYWAY_DEFAULT_SCHEMA
              value: "analytics"
            - name: SPRING_FLYWAY_SCHEMAS
              value: "analytics"
            - name: SPRING_FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            - name: SPRING_FLYWAY_BASELINE_VERSION
              value: "1"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(ANALYTICS_DB_NAME)?currentSchema=analytics"
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: swiftpay-app-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_CONSUMER_GROUP_ID
              value: analytics-worker-group
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: swiftpay-app-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: swiftpay-app-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftpay-db-secret
                  key: REDIS_PASSWORD
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx512m"

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
