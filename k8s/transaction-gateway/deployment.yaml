apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-gateway
  namespace: swiftpay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-gateway
  template:
    metadata:
      labels:
        app: transaction-gateway
    spec:
      containers:
        - name: transaction-gateway
          image: swiftpay/transaction-gateway:latest
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_PROFILES_ACTIVE
              value: docker
