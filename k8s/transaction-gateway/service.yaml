apiVersion: v1
kind: Service
metadata:
  name: transaction-gateway
  namespace: swiftpay
  labels:
    app: transaction-gateway
    app.kubernetes.io/name: swiftpay
    app.kubernetes.io/part-of: payment-ledger
spec:
  type: NodePort
  selector:
    app: transaction-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8081
      nodePort: 30081
