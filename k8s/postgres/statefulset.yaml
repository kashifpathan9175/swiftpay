apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: swiftpay
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      initContainers:
        - name: fix-perms
          image: busybox
          command: ["sh", "-c", "chown -R 999:999 /var/lib/postgresql || true"]
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
      containers:
        - name: postgres
          image: postgres:18
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: swiftpay-db-secret
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftpay-db-secret
                  key: DB_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: ""
            - name: POSTGRES_MULTIPLE_DATABASES
              value: "swift-pay_txn_gateway,swiftpay_ledger,swiftpay_analytics"
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init-scripts
            defaultMode: 0775

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app: postgres
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
        storageClassName: standard
