name: SwiftPay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [transaction-gateway, ledger-service, analytics-worker]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Compile
        working-directory: ${{ matrix.service }}
        run: mvn -B -ntp -DskipTests compile

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: mvn -B -ntp test

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [transaction-gateway, ledger-service, analytics-worker]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: ${{ matrix.service }}
        run: docker build -t swiftpay/${{ matrix.service }}:${{ github.sha }} .
