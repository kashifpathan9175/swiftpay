server:
  port: ${SERVER_PORT:8083}

spring:
  datasource:
    url: ${ANALYTICS_DB_URL:jdbc:postgresql://postgres:5432/swiftpay_analytics}
    username: ${ANALYTICS_DB_USERNAME:postgres}
    password: ${ANALYTICS_DB_PASSWORD:root}
    driver-class-name: ${ANALYTICS_DB_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: analytics
        format_sql: false
    open-in-view: false

  hikari:
    maximum-pool-size: 4
    minimum-idle: 1
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000
    pool-name: AnalyticsWorkerHikariPool

  flyway:
    enabled: true
    default-schema: analytics
    schemas: analytics
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:analytics-worker-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true
